# Cloud Run service definition
# Deploy with:
#   gcloud run services replace cloudrun-service.yaml --region us-central1
#
# Or let the GitHub Actions workflow manage this automatically.
#
# IMPORTANT — before deploying, substitute the two placeholder values:
#   IMAGE:            your Artifact Registry image URI
#                     e.g. us-central1-docker.pkg.dev/PROJECT_ID/repo-people/backend:latest
#   CORS_ORIGINS:     comma-separated list of your frontend URL(s)
#                     e.g. https://repo-people.vercel.app
#   BACKEND_URL:      your public Cloud Run service URL (no trailing slash)
#                     e.g. https://repo-people-app-xxxxx-ew.a.run.app
#   FRONTEND_URL:     your Vercel app URL (no trailing slash)
#                     e.g. https://repo-people.vercel.app

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: repo-people-backend
  annotations:
    # Allow unauthenticated public access (the app has no built-in auth layer)
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # maxScale=1 is required ONLY while running on the SQLite fallback,
        # which keeps state in-process. Once DATABASE_URL points at Postgres the
        # store is shared, and this can be raised (and minScale set to 1 to keep
        # the scheduled-refetch runner alive between requests).
        # minScale=1 keeps one instance warm. Required: the scheduled re-fetch
        # runner (_schedule_loop in main.py) is an in-process asyncio loop, so
        # at minScale=0 the service scales to zero, the loop dies with it, and
        # schedules silently never fire while the UI still shows them enabled.
        # Set this back to "0" only if you drop the scheduling feature, or move
        # it to Cloud Scheduler hitting an authenticated endpoint. Note that a
        # warm instance bills continuously.
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "1"
        # Gen2 execution environment — better performance and full Linux syscalls
        run.googleapis.com/execution-environment: gen2
    spec:
      # Allow up to 3600 s per request — required for long-running SSE fetch jobs
      timeoutSeconds: 3600
      # Number of concurrent requests per container instance
      containerConcurrency: 80
      containers:
        - image: IMAGE  # substituted by CI/CD — see .github/workflows/deploy-cloud-run.yml
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: CORS_ORIGINS
              value: "CORS_ORIGINS"  # substituted by CI/CD from GH secret FRONTEND_URL
            - name: BACKEND_URL
              value: "BACKEND_URL"
            - name: FRONTEND_URL
              value: "FRONTEND_URL"
            # Durable storage. Without this the app falls back to SQLite in
            # /tmp, which is wiped on every cold start. Store the real value in
            # Secret Manager and reference it here rather than inlining it.
            # - name: DATABASE_URL
            #   valueFrom:
            #     secretKeyRef: { name: repo-people-db-url, key: latest }
            # Fernet key encrypting OAuth session tokens at rest. Generate with:
            #   python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
            # Without it the app falls back to a per-process ephemeral key, which
            # is still safe but signs every user out on each restart.
            # - name: SESSION_TOKEN_KEY
            #   valueFrom:
            #     secretKeyRef: { name: repo-people-session-key, key: latest }
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          # Liveness probe — restart container if it stops responding
          livenessProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          # Startup probe — give uvicorn time to boot before traffic is sent
          startupProbe:
            httpGet:
              path: /healthz
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 10
